[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaming-robot-arm"
version = "0.5.0"
description = "Spielbares Muehlespiel mit uArm-Roboter, Computer Vision und grafischer Benutzeroberflaeche."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "pyserial>=3.0",
]

[project.optional-dependencies]
hardware = [
    "uArm-Python-SDK @ git+https://github.com/uarm-developer/uArm-Python-SDK@2.0",
]
ui = [
    "PySide6>=6.6",
]
speech = [
    "RealtimeSTT>=0.3",
    "pyaudio>=0.2",
    "rapidfuzz>=3.0",
    "spacy>=3.0",
    "de_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
gra = "gaming_robot_arm.__main__:main"
gra-mill-play = "gaming_robot_arm.games.mill.cli.play:main"
gra-mill-benchmark = "gaming_robot_arm.games.mill.cli.benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gaming_robot_arm*"]
